name: Docs

# Manual and on release only. Read the Docs still builds this project from the
# previous maintainer's repository, so until that transfer lands these are the
# only current docs.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install
      run: |
        pip install .
        pip install sphinx sphinx_rtd_theme
    - name: Build
      run: sphinx-build -b html docs/source _site -W --keep-going
    - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
