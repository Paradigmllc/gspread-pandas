# Publishes to PyPI when a GitHub release is created.
#
# Authentication is by trusted publishing (OIDC), so there is no API token to
# store, leak, or rotate: PyPI verifies the short-lived identity GitHub mints
# for this specific workflow in this specific repository and environment.
# https://docs.pypi.org/trusted-publishers/

name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/gspread-pandas

    permissions:
      # required to mint the OIDC token; nothing else is needed
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install build backend
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build sdist and wheel
      run: python -m build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
